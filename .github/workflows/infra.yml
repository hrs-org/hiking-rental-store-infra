name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy (uat / prod)"
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          tenant-id: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          subscription-id: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform plan \
            -var-file=environments/${{ github.event.inputs.environment }}.tfvars \
            -var "mysql_admin_user=${{ secrets.TF_MYSQL_ADMIN_USER }}" \
            -var "mysql_admin_password=${{ secrets.TF_MYSQL_ADMIN_PASSWORD }}" \
            -var "mysql_connection_string=${{ secrets.TF_MYSQL_CONNECTION_STRING }}" \
            -var "jwt_secret=${{ secrets.TF_JWT_SECRET }}"

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform apply -auto-approve \
            -var-file=environments/${{ github.event.inputs.environment }}.tfvars \
            -var "mysql_admin_user=${{ secrets.TF_MYSQL_ADMIN_USER }}" \
            -var "mysql_admin_password=${{ secrets.TF_MYSQL_ADMIN_PASSWORD }}" \
            -var "mysql_connection_string=${{ secrets.TF_MYSQL_CONNECTION_STRING }}" \
            -var "jwt_secret=${{ secrets.TF_JWT_SECRET }}"

      - name: Share outputs with app repos
        run: |
          gh secret set API_URL --body "$(terraform output -raw api_url)" --repo hrs-org/hiking-rental-store-web
          gh secret set MYSQL_FQDN --body "$(terraform output -raw mysql_fqdn)" --repo hrs-org/hiking-rental-store-api
          gh secret set STATIC_WEB_APP_URL --body "$(terraform output -raw static_web_app_url)" --repo hrs-org/hiking-rental-store-web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
