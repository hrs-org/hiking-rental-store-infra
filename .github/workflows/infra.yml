name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy (uat / prod)"
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform plan -input=false \
            -var-file=environments/${{ github.event.inputs.environment }}.tfvars \
            -var "mysql_admin_user=${{ secrets.TF_MYSQL_ADMIN_USER }}" \
            -var "mysql_admin_password=${{ secrets.TF_MYSQL_ADMIN_PASSWORD }}" \
            -var "mysql_connection_string=${{ secrets.TF_MYSQL_CONNECTION_STRING }}" \
            -var "jwt_secret=${{ secrets.TF_JWT_SECRET }}" \
            -var "allowed_origins=${{ secrets.TF_ALLOWED_ORIGINS }}" \
            -var "application_insights_connection_string=${{ secrets.TF_APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
            -var "application_insights_instrumentation_key=${{ secrets.TF_APPINSIGHTS_INSTRUMENTATIONKEY }}"

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform apply -auto-approve -input=false \
            -var-file=environments/${{ github.event.inputs.environment }}.tfvars \
            -var "mysql_admin_user=${{ secrets.TF_MYSQL_ADMIN_USER }}" \
            -var "mysql_admin_password=${{ secrets.TF_MYSQL_ADMIN_PASSWORD }}" \
            -var "mysql_connection_string=${{ secrets.TF_MYSQL_CONNECTION_STRING }}" \
            -var "jwt_secret=${{ secrets.TF_JWT_SECRET }}" \
            -var "allowed_origins=${{ secrets.TF_ALLOWED_ORIGINS }}" \
            -var "application_insights_connection_string=${{ secrets.TF_APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
            -var "application_insights_instrumentation_key=${{ secrets.TF_APPINSIGHTS_INSTRUMENTATIONKEY }}"

      - name: Share outputs with app repos
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh secret set API_URL --body "$(terraform output -raw api_url)" --repo hrs-org/hiking-rental-store-web
          gh secret set JWT_SECRET --body "${{ secrets.TF_JWT_SECRET }}" --repo hrs-org/hiking-rental-store-api
          gh secret set TF_MYSQL_CONNECTION_STRING --body "${{ secrets.TF_MYSQL_CONNECTION_STRING }}" --repo hrs-org/hiking-rental-store-api
